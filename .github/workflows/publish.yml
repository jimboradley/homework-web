name: Publish app update

# Every push to main publishes a new version. Phones with the Homework app download it
# in the background and switch to it the next time the app is closed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build update bundle
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p bundle out
          cp -r www/. bundle/
          sed -i "s/__APP_VERSION__/${VERSION}/" bundle/index.html
          grep -q "APP_VERSION='${VERSION}'" bundle/index.html
          (cd bundle && zip -qr "../out/bundle-${VERSION}.zip" .)
          cp -r bundle/. out/
          printf '{"version":"%s","url":"https://raw.githubusercontent.com/%s/dist/bundle-%s.zip"}\n' \
            "$VERSION" "$GITHUB_REPOSITORY" "$VERSION" > out/version.json
          cat out/version.json

      - name: Publish to the dist branch
        working-directory: out
        run: |
          git init -q -b dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Publish $(jq -r .version version.json)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" dist
